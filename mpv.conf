# include=mpv_linux.conf
audio-delay=-.3
force-window=yes
idle=once
drag-and-drop=insert-next

# Languages #
sub-scale=1.6
alang=jpn,jp,eng,en,enUS,en-US,de,ger # Audio language priority
slang=eng,en,jp,jap,und,de,ger        # Subtitle language priority
sub-ass-override=scale
secondary-sub-ass-override=scale
secondary-sid=no
sub-margin-y=0
sub-use-margins=yes
secondary-sub-pos=75
sub-auto=fuzzy
sub-file-paths="$HOME/Videos/subs"

# WATCH LATER #
save-position-on-quit=yes
resume-playback=yes
save-watch-history=yes

# input-ipc-server=$HOME/.config/mpvc/mpvsocket0
input-ipc-server=/tmp/mpv.sock

